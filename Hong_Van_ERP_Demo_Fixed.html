ixed;inset:0;background:radial-gradient(circle at 80% 20%,#294e85 0,#152943 45%,#0f1d31 100%);display:grid;place-items:center;z-index:100;padding:20px}.login-card{width:min(440px,100%);background:#fff;border-radius:20px;padding:32px;box-shadow:0 30px 90px #0005}.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:26px}.login-card h1{font-size:24px;margin:0 0 8px}.login-card p{color:var(--muted);margin:0 0 23px;line-height:1.5}.login-card .field{margin-bottom:15px}.login-card .primary{width:100%;padding:12px}.demo-users{background:#f5f8fc;border:1px solid var(--line);padding:12px;border-radius:10px;margin-top:16px;font-size:11px;color:#64748b;line-height:1.8}.modal-backdrop{position:fixed;inset:0;background:#101d31a8;z-index:80;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(720px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 80px #0003}.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0;font-size:17px}.modal-body{padding:22px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.form-grid .full{grid-column:1/-1}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:15px 22px;border-top:1px solid var(--line)}.toast{position:fixed;bottom:22px;right:22px;background:#16263d;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:200;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.bar-list{display:grid;gap:14px}.bar-row{display:grid;grid-template-columns:100px 1fr 45px;gap:10px;align-items:center;font-size:11px}.bar-track{height:8px;border-radius:99px;background:#edf1f7;overflow:hidden}.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#3b70e4,#19b5aa)}.notice{padding:12px 14px;border-radius:1 .report-stats{grid-template-columns:repeat(3,minmax(0,1fr));}
.report-month-panel{margin-bottom:16px}
.report-month-head{min-height:68px}
.month-filter-wrap{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:700}
.month-filter{border:1px solid #dce4ee;border-radius:10px;background:#f8fafd;color:var(--text);padding:10px 12px;min-width:190px;outline:none;font:inherit;cursor:pointer;transition:.15s}
.month-filter:focus{border-color:#6b95f0;box-shadow:0 0 0 3px #2764d817;background:#fff}
.report-month-body{padding:22px 26px}

.report-metric+ .report-metric{border-top:1px solid var(--line)}
.report-metric b{font-size:18px;color:var(--text);white-space:nowrap}
@media(max-width:720px){.report-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.report-month-head{align-items:flex-start;flex-direction:column}.month-filter-wrap{width:100%;align-items:flex-start;flex-direction:column}.month-filter{width:100%;min-width:0}.report-month-body{padding:14px}.report-metric{font-size:13px;padding:14px 4px;align-items:flex-start}.report-metric b{font-size:14px}}

.staff-picker{display:grid;gap:4px;max-height:230px;overflow:auto;border:1px solid #dce4ee;border-radius:8px;padding:6px}
.field label.pick{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:400;color:var(--text)}
.field label.pick input{width:auto;flex:none;margin:0;accent-color:var(--blue)}.field label.pick:hover{background:#f5f8fc}.field label.pick.busy{opacity:.6;cursor:not-allowed}
.report-head-filters{flex-wrap:wrap}.report-head-filters .search{width:auto}

<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><div class="brand-mark"><img class="app-logo" alt="Logo"></div><div><strong>HỒNG VÂN ERP</strong><div class="muted" style="font-size:11px;margin-top:3px">Nền tảng quản trị vận hành cảng</div></div></div>
    <h1>Đăng nhập hệ thống</h1>
    <p>Demo ERP phục vụ quản lý kinh doanh, khai thác, giao nhận và quản trị nội bộ Cảng Hồng Vân.</p>
    <form id="loginForm">
      <div class="field"><label>Tài khoản</label><input id="loginUser" type="text" autocomplete="username" placeholder="Nhập tài khoản" required></div>
      <div class="field"><label>Mật khẩu demo</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required></div>
      <button class="primary" type="submit">Đăng nhập <span style="float:right">→</span></button>
    </form>  </div>
</div>

<div class="app" id="app" style="display:none">
<aside class="sidebar" id="sidebar">

  <div class="side-foot">ERP DEMO • v1.1</div>
</aside>

function contractPaid(c){const isPayable=c.partyType==='Nhà cung cấp (chi)';return (db.finance||[]).filter(f=>f.contractId===c.id&&f.status==='Đã thanh toán'&&((isPayable&&f.type==='Chi tiền')||(!isPayable&&f.type==='Thu tiền'))).reduce((a,f)=>a+(Number(f.amount)||0),0)}
function contractBalance(c){return Math.max(0,(Number(c.price)||0)-contractPaid(c))}
function openCustomerDetail(id){state.customerDetailId=id;state.detailSearch='';state.detailFilter='all';renderCustomerDetail()}
function openSupplierDetail(id){state.supplierDetailId=id;state.detailSearch='';state.detailFilter='all';renderSupplierDetail()}
function partnerCfg(key){return key==='customers'?{id:state.customerDetailId,field:'customerId',back:'customerDetailId',backLabel:'khách hàng',valueLabel:'Giá trị hợp đồng',valueNote:'Tổng hợp đồng thu',paidNote:'Theo các khoản Thu tiền liên kết',restNote:'Chưa thu đủ',listTitle:'Danh sách hợp đồng của khách hàng',empty:'Khách hàng chưa có hợp đồng'}:{id:state.supplierDetailId,field:'supplierId',back:'supplierDetailId',backLabel:'nhà cung cấp',valueLabel:'Giá trị hợp đồng chi',valueNote:'Tổng hợp đồng nhà cung cấp',paidNote:'Theo các khoản Chi tiền đã thanh toán',restNote:'Chưa chi đủ',listTitle:'Danh sách hợp đồng chi của nhà cung cấp',empty:'Nhà cung cấp chưa có hợp đồng'}}
function partnerContracts(key,filtered){const g=partnerCfg(key),q=norm((state.detailSearch||'').trim()),st=state.detailFilter||'all';return db.contracts.filter(x=>x[g.field]===g.id&&(!filtered||((!q||[x.code,x.contractName,x.service,x.status,dateFmt(x.start),dateFmt(x.end),money(x.price),x.price].some(v=>norm(v).includes(q)))&&(st==='all'||x.status===st))))}
function partnerRowsHtml(key){return partnerContracts(key,true).map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.contractName||'—')}</td><td>${esc(x.service||'—')}</td><td>${dateFmt(x.start)}</td><td>${dateFmt(x.end)}</td><td>${money(x.price)}</td><td>${money(contractPaid(x))}</td><td>${money(contractBalance(x))}</td><td>${labelStatus(x.status)}</td><td><button class="secondary small" onclick="openForm('contracts','${x.id}')">Sửa</button></td></tr>`).join('')||`<tr><td colspan="10" class="empty">${partnerContracts(key,false).length?'Không có hợp đồng phù hợp với bộ lọc':partnerCfg(key).empty}</td></tr>`}

 <div class="panel"><div class="panel-head"><h3>Sao lưu và phục hồi</h3></div><div class="panel-body"><p class="muted" style="line-height:1.6">Tải bản sao dữ liệu để lưu trữ định kỳ hoặc phục hồi khi cần.</p><div class="btn-row"><button class="primary" onclick="exportAll()">⇩ Tải bản sao JSON</button><button class="secondary" onclick="$('importFile').click()">⇧ Nhập bản sao JSON</button><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importAll(event)"></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><button class="danger" onclick="resetDemo()">Khôi phục dữ liệu demo ban đầu</button></div></div></div>`;

function importAll(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.customers||!d.shipments||!d.users)throw new Error('invalid');if(!Array.isArray(d.suppliers))d.suppliers=[];db=d;saveDB();showToast('Đã nhập dữ liệu');renderPage()}catch(e){showToast('File JSON không đúng định dạng')}};rd.readAsText(f);ev.target.value=''}
function resetDemo(){if(!confirm('Khôi phục dữ liệu demo? Toàn bộ dữ liệu đã thêm/sửa/xóa sẽ bị thay thế.'))return;localStorage.removeItem(DBKEY);db=seedDB();showToast('Đã khôi phục dữ liệu demo');renderPage()}

function exportCSV(key){const rows=db[key]||[];if(!rows.length){showToast('Không có dữ liệu để xuất');return}const cols=Object.keys(rows[0]);const csv=[cols.join(','),...rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(','))].join('\r\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),`hongvan-${key}.csv`)}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openForm(key,id=null){

 $('modalTitle').textContent=(id?'Sửa ':'Thêm ')+m.singular;$('formFields').innerHTML=m.fields.map(f=>{let [name,label,type,opts,required]=f;if(opts===true){required=true;opts=null}if(key==='tasks'&&(name==='kind'||(leaderTask&&(name==='contractId'||name==='assetId'||(name==='status'&&!id)))))return '';let val=record?.[name]??'';let req=required===true?'required':'';let cls=type==='textarea'?'full':'';let input='';
 if(type==='select')input=`<select name="${name}" ${req}>${(opts||[]).map(o=>`<option ${String(val)===o?'selected':''} value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
 else if(type==='staff'){cls='full';input=`<div class="staff-picker" id="staffPicker">${staffPickerHtml(record.department,record.staffIds||[],id)}</div>`}

 else if(type==='relation'){let list=db[opts]||[];input=`<select name="${name}" ${req}><option value="">— Chọn —</option>${list.map(o=>{let label=(opts==='customers'||opts==='suppliers')?`${o.code} — ${o.name}`:o.code;return `<option value="${o.id}" ${val===o.id?'selected':''}>${esc(label)}</option>`}).join('')}</select>`}

 else input=`<input name="${name}" type="${type}" value="${esc(val)}" ${req} ${type==='number'?'step="any"':''}>`;
 return `<div class="field ${cls}"><label>${label}${required===true?' *':''}</label>${input}</div>`}).join('');
 if(key==='contracts'){const syncParty=()=>{const type=$('formFields').querySelector('[name=partyType]')?.value;const c=$('formFields').querySelector('[name=customerId]')?.closest('.field');const sup=$('formFields').querySelector('[name=supplierId]')?.closest('.field');if(c)c.style.display=type==='Khách hàng (thu)'?'':'none';if(sup)sup.style.display=type==='Nhà cung cấp (chi)'?'':'none';};$('formFields').querySelector('[name=partyType]')?.addEventListener('change',syncParty);syncParty();}

 $('modalBackdrop').classList.add('show');
}
function closeModal(){$('modalBackdrop').classList.remove('show');state.editingId=null;state.editingKey=null}
$('recordForm').addEventListener('submit',e=>{e.preventDefault();const key=state.editingKey,m=meta[key],id=state.editingId;const data={};new FormData(e.target).forEach((v,k)=>data[k]=v);m.fields.forEach(f=>{let k=f[0],type=f[2];if(type==='number')data[k]=data[k]===''?'':Number(data[k])});if(key==='weighing'&&(!data.net||Number(data.net)===0)&&data.gross!==''&&data.tare!=='')data.net=Number(data.gross)-Number(data.tare);
 if(key==='tasks'){const old=id?db.tasks.find(x=>x.id===id):null;data.staffIds=new FormData(e.target).getAll('staffIds');data.kind=old?.kind||(state.user==='lanhdao'?'Lãnh đạo giao':'Phòng ban tạo');if(data.kind==='Lãnh đạo giao'){data.contractId='';data.assetId='';if(!id)data.status='Đang thực hiện'}if(!data.staffIds.length){showToast('Vui lòng chọn ít nhất một nhân viên');return}if(OPEN_TASK.includes(data.status)){const c=data.staffIds.map(x=>busyBy('staffIds',x,id)).find(Boolean)||(data.contractId&&busyBy('contractId',data.contractId,id))||(data.assetId&&busyBy('assetId',data.assetId,id));if(c){showToast('Nhân viên, hợp đồng hoặc tài sản đã chọn đang bận ở công việc '+c.code);return}}data.createdBy=old?.createdBy||users[state.user].name}
 if(key==='contracts'){if(data.partyType==='Khách hàng (thu)'){data.supplierId='';if(!data.customerId){showToast('Vui lòng chọn khách hàng cho hợp đồng thu');return}}else{data.customerId='';if(!data.supplierId){showToast('Vui lòng chọn nhà cung cấp cho hợp đồng chi');return}}}
 if(key==='finance'){if(data.type==='Thu tiền'&&!data.customerId){showToast('Vui lòng chọn khách hàng cho khoản thu');return}if(data.type==='Chi tiền'&&!data.supplierId){showToast('Vui lòng chọn nhà cung cấp cho khoản chi');return}}
 if(key==='shipments'&&data.contractId){const c=db.contracts.find(x=>x.id===data.contractId);if(c&&c.customerId&&data.customerId!==c.customerId){showToast('Lưu ý: khách hàng của lô khác khách hàng trên hợp đồng');}}
 if(id){let idx=db[key].findIndex(x=>x.id===id);db[key][idx]={...db[key][idx],...data};}else{data.id=key.slice(0,1)+Date.now().toString(36);db[key].push(data)}
 // Keep cross-module records coherent when a weighing is saved.
 if(key==='weighing'&&data.shipmentId){const s=db.shipments.find(x=>x.id===data.shipmentId);if(s){const related=db.weighing.filter(w=>w.shipmentId===s.id).reduce((a,w)=>a+(Number(w.net)||0),0);s.actual=Number(related.toFixed(3));if(data.status==='Có chênh lệch')s.status='Có sự cố';else if(s.status==='Chờ cân / giao hàng'&&s.actual>0)s.status='Chờ đối chiếu';}}
 if(key==='shipments'&&data.status==='Hoàn thành'){let d=db.documents.find(x=>x.relatedCode===data.code&&x.category==='Giao nhận');if(!d){db.documents.push({id:'d'+Date.now().toString(36),code:'HS-'+data.code,title:'Hồ sơ giao nhận '+data.code,category:'Giao nhận',relatedType:'Lô hàng',relatedCode:data.code,owner:'Phòng Khai thác',due:'',status:'Đang xử lý',note:'Hồ sơ được tạo tự động từ lô hàng hoàn thành; cần kiểm tra chứng từ'});}}
 saveDB();closeModal();showToast(id?'Đã cập nhật dữ liệu':'Đã thêm dữ liệu');renderPage();
});
function deleteRecord(key,id){const rec=(db[key]||[]).find(x=>x.id===id);if(!rec)return;if(['hr','assets','contracts'].includes(key)){const t=busyBy(key==='hr'?'staffIds':key==='assets'?'assetId':'contractId',id);if(t){showToast('Không thể xóa: đang được giao trong công việc '+t.code);return}}if(key==='suppliers'&&db.contracts.some(x=>x.supplierId===id)){showToast('Không thể xóa: nhà cung cấp đang được hợp đồng tham chiếu');return}if(key==='customers'&&db.contracts.some(x=>x.customerId===id)){showToast('Không thể xóa: khách hàng đang được hợp đồng tham chiếu');return}if(key==='contracts'&&db.shipments.some(x=>x.contractId===id)){showToast('Không thể xóa: hợp đồng đang được lô hàng tham chiếu');return}if(key==='shipments'&&(db.operations.some(x=>x.shipmentId===id)||db.weighing.some(x=>x.shipmentId===id))){showToast('Không thể xóa: lô hàng đã có kế hoạch hoặc phiếu cân');return}if(!confirm(`Xóa "${rec.code||rec.name||rec.username||'bản ghi'}"?`))return;db[key]=db[key].filter(x=>x.id!==id);saveDB();showToast('Đã xóa bản ghi');renderPage()}
</script>
</body>
